name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify with PostgreSQL integration tests
        working-directory: polygim-api
        run: ./mvnw -B -ntp clean verify
      - name: Publish test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-reports
          path: |
            polygim-api/target/surefire-reports/
            polygim-api/target/failsafe-reports/
            polygim-api/target/site/jacoco/
          if-no-files-found: ignore

openapi: 3.0.3
info:
  title: API de gestión multi-gimnasio
  version: 1.0.0
  description: Contrato propuesto de la feature 1. No implica implementación ni pruebas ejecutadas. Tenant
    de identidad vigente, nunca de parámetros del cliente. Errores RFC 7807.
servers:
- url: http://localhost:8080
  description: Entorno local futuro
security:
- bearerAuth: []
paths:
  /api/v1/auth/login:
    post:
      operationId: login
      summary: Autenticarse con email global y contraseña
      tags:
      - auth
      x-roles:
      - SUPERADMIN
      - ADMIN
      - RECEPCION
      responses:
        '200':
          description: Operación completada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '500':
          $ref: '#/components/responses/500'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
  /api/v1/auth/me:
    get:
      operationId: currentUser
      summary: Consultar identidad vigente propia
      tags:
      - auth
      x-roles:

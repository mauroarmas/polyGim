components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    size:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    '400':
      description: Datos inválidos
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    '401':
      description: Autenticación requerida o inválida
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        WWW-Authenticate:
          schema:
            type: string
          description: Desafío Bearer cuando corresponda.
    '403':
      description: Operación no permitida por el rol
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    '404':
      description: Recurso inexistente o ajeno, sin distinción
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    '409':
      description: Conflicto de unicidad o estado
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    '405':
      description: Método no admitido
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    '415':
      description: Contenido no admitido
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    '500':
      description: Error interno genérico
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Money:
      type: string
      pattern: ^(0|[1-9][0-9]{0,16})\.[0-9]{2}$
      description: Decimal exacto canónico de dos posiciones, hasta NUMERIC(19,2).
      example: '200.50'
    PositiveMoney:
      type: string
      pattern: ^(?!0\.00$)(0|[1-9][0-9]{0,16})\.[0-9]{2}$
      description: Importe estrictamente positivo; no se redondean entradas.
      example: '100.25'
    Role:
      type: string
      enum:
      - SUPERADMIN
      - ADMIN
      - RECEPCION
    DurationUnit:
      type: string
      enum:
      - DIAS
      - SEMANAS
      - MESES
    PaymentState:
      type: string
      enum:
      - PENDIENTE
      - PAGADO
    Validity:
      type: string
      enum:
      - VIGENTE
      - VENCIDA
    Problem:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          maxLength: 100
        errors:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              field:
                type: string
              message:
                type: string
            required:
            - field
            - message
      required:
      - type
      - title
      - status
      - detail
      - instance
    LoginRequest:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
          writeOnly: true
          maxLength: 72
      required:
      - email
      - password
    NewAccountRequest:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 12
          writeOnly: true
          description: Además, máximo 72 bytes UTF-8. Nunca se trunca.
          maxLength: 72
      required:
      - email
      - password
    User:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
          maxLength: 254
        rol:
          $ref: '#/components/schemas/Role'
        habilitada:
          type: boolean
        gimnasioId:
          type: string
          format: uuid
          nullable: true
      required:
      - id
      - email
      - rol
      - habilitada
      - gimnasioId
    TokenResponse:
      type: object
      additionalProperties: false
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          enum:
          - Bearer
        expiresIn:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
        usuario:
          $ref: '#/components/schemas/User'
      required:
      - accessToken
      - tokenType
      - expiresIn
      - usuario
    GymCreateRequest:
      type: object
      additionalProperties: false
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 100
        logoUrl:
          type: string
          format: uri
          pattern: ^https?://
          maxLength: 2048
        colorPrimario:
          type: string
          pattern: ^#[0-9A-Fa-f]{6}$
        administradorInicial:
          $ref: '#/components/schemas/NewAccountRequest'
      required:
      - nombre
      - logoUrl
      - colorPrimario
      - administradorInicial
    Gym:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
          minLength: 1
          maxLength: 100
        logoUrl:
          type: string
          format: uri
          pattern: ^https?://
          maxLength: 2048
        colorPrimario:
          type: string
          pattern: ^#[0-9A-Fa-f]{6}$
      required:
      - id
      - nombre
      - logoUrl
      - colorPrimario
    GymCreated:
      type: object
      additionalProperties: false
      properties:
        gimnasio:
          $ref: '#/components/schemas/Gym'
        administradorInicial:
          $ref: '#/components/schemas/User'
      required:
      - gimnasio
      - administradorInicial
    Configuration:
      type: object
      additionalProperties: false
      properties:
        cantidadMaximaCompra:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
      required:
      - cantidadMaximaCompra
    CatalogWrite:
      type: object
      additionalProperties: false
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 100
      required:
      - nombre
    CatalogItem:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
          minLength: 1
          maxLength: 100
      required:
      - id
      - nombre
    MembershipCreate:
      type: object
      additionalProperties: false
      properties:
        disciplinaId:
          type: string
          format: uuid
        nombre:
          type: string
          minLength: 1
          maxLength: 100
        precio:
          $ref: '#/components/schemas/PositiveMoney'
        duracion:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
        unidadDuracion:
          $ref: '#/components/schemas/DurationUnit'
      required:
      - disciplinaId
      - nombre
      - precio
      - duracion
      - unidadDuracion
    MembershipUpdate:
      type: object
      additionalProperties: false
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 100
        precio:
          $ref: '#/components/schemas/PositiveMoney'
        duracion:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
        unidadDuracion:
          $ref: '#/components/schemas/DurationUnit'
      required:
      - nombre
      - precio
      - duracion
      - unidadDuracion
    Membership:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        disciplinaId:
          type: string
          format: uuid
        nombre:
          type: string
          minLength: 1
          maxLength: 100
        precio:
          $ref: '#/components/schemas/PositiveMoney'
        duracion:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
        unidadDuracion:
          $ref: '#/components/schemas/DurationUnit'
      required:
      - id
      - disciplinaId
      - nombre
      - precio
      - duracion
      - unidadDuracion
    ClientWrite:
      type: object
      additionalProperties: false
      properties:
        dni:
          type: string
          pattern: ^[0-9]{7,8}$
        nombre:
          type: string
          minLength: 1
          maxLength: 100
        apellido:
          type: string
          minLength: 1
          maxLength: 100
        telefono:
          type: string
          nullable: true
          maxLength: 40
        canalLlegadaId:
          type: string
          format: uuid
          nullable: true
        direccion:
          type: object
          additionalProperties: false
          properties:
            calle:
              type: string
              nullable: true
              maxLength: 160
            altura:
              type: string
              nullable: true
              maxLength: 20
          nullable: true
        localidadId:
          type: string
          format: uuid
          nullable: true
      required:
      - dni
      - nombre
      - apellido
      description: PUT reemplaza todos los campos editables; opcionales omitidos se limpian.
    Client:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        dni:
          type: string
          pattern: ^[0-9]{7,8}$
        nombre:
          type: string
          minLength: 1
          maxLength: 100
        apellido:
          type: string
          minLength: 1
          maxLength: 100
        telefono:
          type: string
          nullable: true
          maxLength: 40
        canalLlegadaId:
          type: string
          format: uuid
          nullable: true
        direccion:
          type: object
          additionalProperties: false
          properties:
            calle:
              type: string
              nullable: true
              maxLength: 160
            altura:
              type: string
              nullable: true
              maxLength: 20
          nullable: true
        localidadId:
          type: string
          format: uuid
          nullable: true
        fechaIngreso:
          type: string
          format: date
      required:
      - id
      - dni
      - nombre
      - apellido
      - fechaIngreso
    OrderCreate:
      type: object
      additionalProperties: false
      properties:
        clienteId:
          type: string
          format: uuid
        membresiaId:
          type: string
          format: uuid
        cantidad:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
        fechaCompra:
          type: string
          format: date
        pedidoAnteriorId:
          type: string
          format: uuid
          nullable: true
      required:
      - clienteId
      - membresiaId
      - cantidad
      description: 'Sin precio/total/tenant ni lista de detalles. Renovación: antecedente propio, mismo
        cliente y membresía, cronológicamente previo y sin sucesor.'
    Order:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        clienteId:
          type: string
          format: uuid
        membresiaId:
          type: string
          format: uuid
        cantidad:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
        precioUnitario:
          $ref: '#/components/schemas/PositiveMoney'
        duracionMembresia:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
        unidadDuracion:
          $ref: '#/components/schemas/DurationUnit'
        total:
          $ref: '#/components/schemas/PositiveMoney'
        fechaCompra:
          type: string
          format: date
        fechaBaseVencimiento:
          type: string
          format: date
        fechaVencimiento:
          type: string
          format: date
        pedidoAnteriorId:
          type: string
          format: uuid
          nullable: true
        deuda:

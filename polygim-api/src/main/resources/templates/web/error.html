<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title th:text="${title}"></title>
    <link rel="stylesheet" th:href="@{/assets/app.css}" />
  </head>
  <body>
    <main class="standalone">
      <span class="brand-mark">G<span>•</span></span>
      <p class="eyebrow" th:text="|SOLICITUD ${status}|"></p>

      <p>Podés volver al formulario con el botón Atrás del navegador.</p>

    </main>
  </body>
</html>
